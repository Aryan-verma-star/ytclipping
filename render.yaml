# Render blueprint — free-tier deployment.
# Docs: https://render.com/docs/blueprint-spec
#
# BEFORE FIRST DEPLOY: set CLIPPER_DATABASE_URL to your Neon connection string
# (Render dashboard → Environment, or the `sync: false` prompts below).
services:
  - type: web
    name: youtube-clipper
    runtime: docker
    plan: free
    # Closest free-tier region to India. Alternatives: oregon (US West,
    # largest capacity), frankfurt (EU). Change in the dashboard anytime.
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: CLIPPER_ENVIRONMENT
        value: production
      # Your Neon (or other Postgres) connection string — REQUIRED.
      # Must start with postgresql:// (or postgres://).
      - key: CLIPPER_DATABASE_URL
        sync: false
      # Ordered provider chain. vidssave works from any IP (their resolvers do
      # the YouTube talking; CDN links are not IP-locked) — verified live.
      # cobalt needs CLIPPER_COBALT_API_URL (+ optional key); ytdlp needs
      # CLIPPER_YTDLP_COOKIES(_FILE) on datacenter IPs.
      - key: CLIPPER_DOWNLOADER_PROVIDERS
        value: vidssave,cobalt,ytdlp
      - key: CLIPPER_VIDSSAVE_ENABLED
        value: "true"
      - key: CLIPPER_COBALT_API_URL
        sync: false
      - key: CLIPPER_COBALT_API_KEY
        sync: false
      - key: CLIPPER_YTDLP_COOKIES_FILE
        sync: false
      # Alternative to the file above: paste your cookies.txt CONTENT here
      # (Render dashboard → Environment). Friendlier than secret files.
      - key: CLIPPER_YTDLP_COOKIES
        sync: false
      # ONLY for split deployments (frontend on Vercel, backend here):
      # comma-separated browser origins allowed to call the API, e.g.
      # https://youtube-clipper.vercel.app — leave unset for same-origin.
      - key: CLIPPER_ALLOWED_ORIGINS
        sync: false
      # Sensible free-tier defaults (override as needed):
      - key: CLIPPER_MAX_CLIP_SECONDS
        value: "600"
      - key: CLIPPER_MAX_SOURCE_SECONDS
        value: "14400"
      - key: CLIPPER_CLIP_RETENTION_HOURS
        value: "24"
      # Uploaded source files (POST /api/uploads): cap + retention
      - key: CLIPPER_MAX_UPLOAD_BYTES
        value: "400000000"
      - key: CLIPPER_UPLOAD_RETENTION_HOURS
        value: "24"
      - key: CLIPPER_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: CLIPPER_RATE_LIMIT_JOBS_PER_MINUTE
        value: "6"
      # Cheap status polls get a dedicated generous bucket (see .env.example)
      - key: CLIPPER_RATE_LIMIT_STATUS_PER_MINUTE
        value: "300"
